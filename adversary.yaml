name: go/modules
version: 0.0.14
description: Reviews Go module metadata for reproducibility, upgrade safety, and maintainable dependency ownership.

triggers:
  manual: true
  files_changed:
    - "go.mod"
    - "go.sum"
    - "go.work"
    - "go.work.sum"
    - "go.env"
    - "**/go.mod"
    - "**/go.sum"
    - "**/go.env"
    - "vendor/modules.txt"
    - ".env"
    - ".env.*"
    - "Makefile"
    - "**/Makefile"
    - "**/*.go"
    - "**/*.{yml,yaml,sh}"

detection:
  files:
    - "go.mod"
    - "go.sum"
    - "go.work"
    - "go.work.sum"
    - "go.env"
    - "**/go.mod"
    - "**/go.sum"
    - "**/go.env"
    - "vendor/modules.txt"
    - ".env"
    - ".env.*"
    - "Makefile"
    - "**/Makefile"
    - "**/*.go"
    - "**/*.{yml,yaml,sh}"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write: []
  network: false
  model: true
  environment:
    allow: []

findings:
  format: adversary.review.v1
