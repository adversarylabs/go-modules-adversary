name: go-modules
version: 0.0.1
description: Reviews Go module metadata for reproducibility, upgrade safety, and maintainable dependency ownership.

triggers:
  manual: true
  files_changed:
    - "go.mod"
    - "go.sum"
    - "go.work"
    - "go.work.sum"
    - "**/go.mod"
    - "**/go.sum"
    - "vendor/modules.txt"

detection:
  files:
    - "go.mod"
    - "go.sum"
    - "go.work"
    - "go.work.sum"
    - "**/go.mod"
    - "**/go.sum"
    - "vendor/modules.txt"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write: []
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
